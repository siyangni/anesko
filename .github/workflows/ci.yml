name: CI

on:
  push:
    branches: [ main, master, develop, claude/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpq-dev

      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Check R code
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning")
        shell: Rscript {0}

      - name: Lint R code (non-blocking)
        run: |
          if (requireNamespace("lintr", quietly = TRUE)) {
            lintr::lint_package()
          } else {
            message("lintr not available, skipping")
          }
        shell: Rscript {0}
        continue-on-error: true

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpq-dev

      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "testthat"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Run tests
        run: |
          if (dir.exists("tests")) {
            testthat::test_dir("tests")
          } else {
            message("No tests directory found")
          }
        shell: Rscript {0}
        continue-on-error: true

  structure-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check required files
        run: |
          echo "Checking for required files..."
          files_to_check=("DESCRIPTION" "README.md" "License.md" ".gitignore")

          for file in "${files_to_check[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file missing"
              exit 1
            fi
          done

          echo "All required files present!"

      - name: Check directory structure
        run: |
          echo "Checking directory structure..."
          required_dirs=("shiny-app" "R" "scripts" "docs" "archive")

          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✓ $dir/ exists"
            else
              echo "✗ $dir/ directory missing (one of shiny-app or R is required)"
            fi
          done
