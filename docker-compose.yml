# Docker Compose for American Authorship Database
# This sets up both the Shiny app and PostgreSQL database
# SECURITY: Uses Docker secrets instead of hardcoded credentials

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: american_authorship_db
    environment:
      POSTGRES_DB: american_authorship
      POSTGRES_USER: authorship_admin
      # Use Docker secret for password
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    ports:
      - "5432:5432"
    networks:
      - authorship_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authorship_admin -d american_authorship"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Shiny App
  shiny:
    build: .
    container_name: american_authorship_app
    environment:
      DB_HOST: postgres
      DB_NAME: american_authorship
      DB_USER: authorship_admin
      # Password loaded from secret file
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_PORT: 5432
    secrets:
      - db_password
    ports:
      - "3838:3838"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shiny-app/logs:/var/log/shiny-server
    networks:
      - authorship_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/american-authorship"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  authorship_network:
    driver: bridge

# Docker Secrets Configuration
# Secrets are stored in separate files and NOT committed to git
secrets:
  db_password:
    file: ./secrets/db_password.txt 